[paper]
title = "An Analysis of Pre-trained Models to Identify Cybersecurity Incidents Entities in the Healthcare Industry"
authors = ["Rafael Paim", "Luciano Ignaczak"]
reproduction_status = "extension"
original_corpus_available = false

[collection]
date = "2023-10-30"
period_start = "2023-01-01"
period_end = "2023-10-30"
queries = [
    "hospital AND cyberattack",
    "hospital AND cybersecurity AND incident",
    "healthcare AND cyberattack",
    "healthcare AND cybersecurity AND incident",
]
portals_reported_in_text = [
    "Security Magazine",
    "Becker's Hospital Review",
    "JD Supra",
]
portals_reported_in_table = ["SC Magazine", "Becker's Hospital Review", "JD Supra"]

[collection.counts]
collected = 24108
unique_links = 15705
selected_portals = 1449
final_corpus = 1039

[evaluation]
